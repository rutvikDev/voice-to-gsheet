services:
  - type: web
    name: storyteller-voice-to-gsheet
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_SHEET_ID
        value: 1s9CqUGiXMsGFncCJJ7d002kWkCETk09rP1rkwSy2I9Y
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
