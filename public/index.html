<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storyteller Studio | Voice to Google Sheets</title>
  <meta name="description" content="Storyteller Voice Studio: Speak your story topic and description with real-time speech recognition and sync directly to Google Sheets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <div class="app-layout">
    <!-- Clean Brand Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-box">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            <path d="M12 6l-2 4h4l-2 4" stroke="#a5b4fc" stroke-width="1.8" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Storyteller Studio</h1>
          <p class="brand-tagline">Speak Topic &amp; Description &bull; Sync directly to Google Sheets</p>
        </div>
      </div>
    </header>

    <!-- Main Workspace Card (Storyteller Form) -->
    <main class="main-card">
      <div class="card-inner">
        <!-- Live Listening Indicator -->
        <div id="activeFieldPill" class="listening-pill hidden">
          <span class="pulsing-red-dot"></span>
          <span id="listeningFieldText" class="listening-text">Listening...</span>
          <div class="sound-wave">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <form id="storyForm" onsubmit="return false;" class="story-form">
          <!-- FIELD 1: Story Topic -->
          <div class="form-field-group">
            <div class="field-label-row">
              <label for="topicInput" class="form-label">
                <span class="label-badge">1</span>
                <span>Story Topic</span>
                <span class="required-star">*</span>
              </label>
              <span class="field-hint">Click mic on the right to speak</span>
            </div>

            <div class="input-wrapper field-single-line" id="topicWrapper">
              <input 
                type="text" 
                id="topicInput" 
                placeholder="e.g. The Legend of the Whispering Peaks"
                autocomplete="off"
                spellcheck="true"
              />
              <div class="input-actions-right">
                <button 
                  type="button" 
                  id="clearTopicBtn" 
                  class="action-btn clear-btn hidden" 
                  title="Clear topic"
                  aria-label="Clear topic"
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
                <button 
                  type="button" 
                  id="topicMicBtn" 
                  class="action-btn mic-btn" 
                  title="Speak Story Topic (Microphone)"
                  aria-label="Toggle Microphone for Topic"
                >
                  <svg class="mic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <line x1="12" y1="19" x2="12" y2="22" />
                  </svg>
                  <div class="mic-ring-wave"></div>
                </button>
              </div>
            </div>
          </div>

          <!-- FIELD 2: Short Description -->
          <div class="form-field-group">
            <div class="field-label-row">
              <label for="descInput" class="form-label">
                <span class="label-badge">2</span>
                <span>Short Description</span>
                <span class="required-star">*</span>
              </label>
              <span class="field-hint">Click mic on the right to speak</span>
            </div>

            <div class="input-wrapper field-multi-line" id="descWrapper">
              <textarea 
                id="descInput" 
                placeholder="Speak or type a short description, key characters, and central plot..."
                rows="5"
                spellcheck="true"
              ></textarea>
              <div class="input-actions-right">
                <button 
                  type="button" 
                  id="clearDescBtn" 
                  class="action-btn clear-btn hidden" 
                  title="Clear description"
                  aria-label="Clear description"
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
                <button 
                  type="button" 
                  id="descMicBtn" 
                  class="action-btn mic-btn" 
                  title="Speak Short Description (Microphone)"
                  aria-label="Toggle Microphone for Description"
                >
                  <svg class="mic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <line x1="12" y1="19" x2="12" y2="22" />
                  </svg>
                  <div class="mic-ring-wave"></div>
                </button>
              </div>
            </div>

            <!-- Meta row under Description -->
            <div class="input-meta">
              <div class="meta-left">
                <span id="descCharCount">0 characters</span>
                <span class="meta-dot">•</span>
                <span id="descWordCount">0 words</span>
              </div>
              <div class="meta-right">
                <span class="accuracy-badge">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                  </svg>
                  100% Editable Voice Accuracy
                </span>
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="submit-action-wrapper">
            <button type="button" id="submitBtn" class="submit-btn" disabled>
              <span class="btn-content">
                <svg class="sheet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <path d="M3 9h18" />
                  <path d="M3 15h18" />
                  <path d="M9 3v18" />
                </svg>
                <span id="submitBtnText">Save Story to Google Sheet</span>
                <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </span>
              <span class="btn-spinner hidden" id="btnSpinner"></span>
            </button>
            <div class="shortcut-hint">Tip: Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to save immediately</div>
          </div>
        </form>

        <!-- Result / Notification Banner -->
        <div id="toastMessage" class="toast-banner hidden" role="alert">
          <div class="toast-icon" id="toastIcon"></div>
          <div class="toast-body">
            <div id="toastTitle" class="toast-title"></div>
            <div id="toastSubtitle" class="toast-subtitle"></div>
          </div>
          <button id="toastCloseBtn" class="toast-close" aria-label="Close notification">&times;</button>
        </div>

      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
