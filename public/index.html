<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakStory | Live Speech-to-Text &amp; Google Sheets Journal</title>
  <meta name="description"
    content="SpeakStory: Speak or dictate narratives, case studies, and notes with live speech-to-text recognition synced directly to Google Sheets.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Refined Pen & Paper Typography: Lora (Manuscript Serif), Caveat (Handwritten accents), Plus Jakarta Sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="annyang.min.js"></script>
</head>

<body class="pen-paper-theme">
  <!-- Desk background canvas with warm wood lighting & fine grain -->
  <div class="desk-canvas">
    <div class="desk-wood-vignette"></div>

    <div class="app-layout">
      <!-- Desk Top Bar / Navigation -->
      <header class="journal-header">
        <div class="brand-stationery">
          <!-- Fountain Pen Nib & Voice Emblem SVG -->
          <div class="pen-emblem-badge" title="SpeakStory">
            <svg class="pen-nib-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 3L25 14C25 14 24 18 21.5 20.5L18 32L14.5 20.5C12 18 11 14 11 14L18 3Z"
                fill="url(#nibGradient)" stroke="#2b2319" stroke-width="1.8" stroke-linejoin="round" />
              <line x1="18" y1="14" x2="18" y2="26" stroke="#fdfbf7" stroke-width="1.4" stroke-linecap="round" />
              <circle cx="18" cy="14" r="1.6" fill="#fdfbf7" />
              <path d="M8 29C13 26 23 26 28 29" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
              <defs>
                <linearGradient id="nibGradient" x1="11" y1="3" x2="25" y2="32" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#2d3748" />
                  <stop offset="0.65" stop-color="#1a202c" />
                  <stop offset="1" stop-color="#0f172a" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="journal-title">Speak<span class="brand-accent">Story</span></h1>
          </div>
        </div>

        <!-- Right Side: Journal Date Stamp & Cloud Status -->
        <div class="header-stamps">
          <div class="journal-stamp" title="Current Ledger Date">
            <span class="stamp-label">ENTRY DATE</span>
            <span class="stamp-value" id="todayStamp"></span>
          </div>
        </div>
      </header>

      <!-- Main Workspace: The Storyteller's Legal Pad & Desk Accessories -->
      <div class="notepad-layout-wrapper">

        <!-- Left: The Storyteller's Legal Pad -->
        <div class="notepad-container">
          <!-- Brass Bulldog Binder Clip on top of pad -->
          <div class="brass-binder-clip" aria-hidden="true">
            <div class="clip-loop"></div>
            <div class="clip-body">
              <div class="clip-screws">
                <span class="screw"></span>
                <span class="screw"></span>
              </div>
            </div>
          </div>

          <!-- Main Notepad Sheet -->
          <main class="notepad-sheet" id="notepadPaper">
            <!-- Leather / Binding Strip at the top of the notepad -->
            <div class="notepad-binding-bar">
              <div class="binding-stitches"></div>
            </div>

            <!-- Red Notebook Margin Line (running vertically) -->
            <div class="notepad-red-margin" aria-hidden="true"></div>

            <!-- Sheet Content Inner -->
            <div class="notepad-content">

              <!-- Form Scroll Container (Internal scrollable viewport with hidden scrollbar) -->
              <div class="form-scroll-container" id="formScrollContainer">
                <!-- The Story Form -->
                <form id="storyForm" onsubmit="return false;" class="story-form">

                  <!-- FIELD 1: Story Title -->
                  <section class="notepad-row">
                    <div class="row-header">
                      <label for="storyTitleInput" class="ruled-label">
                        <span class="handwritten-number">1.</span>
                        <span class="label-heading">Story Title</span>
                      </label>
                      <div class="corner-mic-badge" id="micBadge_storyTitle" title="Recording active on Story Title">
                        <span class="live-dot"></span>
                        <span class="rec-label">Recording</span>
                      </div>
                    </div>

                    <div class="paper-input-container field-single-line" id="storyTitleWrapper">
                      <input type="text" id="storyTitleInput" class="paper-text-input"
                        placeholder="e.g. The Highland Victorian Revival" autocomplete="off" spellcheck="true"
                        aria-required="true" />
                      <div class="input-actions-right">
                        <button type="button" id="clearStoryTitleBtn" class="paper-action-btn clear-btn hidden"
                          title="Erase title" aria-label="Clear story title">
                          <svg class="eraser-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6 18M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>
                  </section>

                  <!-- FIELD 2: Story Sub Heading -->
                  <section class="notepad-row">
                    <div class="row-header">
                      <label for="storySubHeadingInput" class="ruled-label">
                        <span class="handwritten-number">2.</span>
                        <span class="label-heading">Story Sub Heading</span>
                      </label>
                      <div class="corner-mic-badge" id="micBadge_storySubHeading"
                        title="Recording active on Story Sub Heading">
                        <span class="live-dot"></span>

                        <span class="rec-label">Recording</span>
                      </div>
                    </div>

                    <div class="paper-input-container field-single-line" id="storySubHeadingWrapper">
                      <input type="text" id="storySubHeadingInput" class="paper-text-input"
                        placeholder="e.g. From cramped vintage kitchen to sunlit culinary oasis" autocomplete="off"
                        spellcheck="true" />
                      <div class="input-actions-right">
                        <button type="button" id="clearStorySubHeadingBtn" class="paper-action-btn clear-btn hidden"
                          title="Erase sub heading" aria-label="Clear story sub heading">
                          <svg class="eraser-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6 18M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>
                  </section>

                  <!-- FIELD 3: Story Description -->
                  <section class="notepad-row">
                    <div class="row-header">
                      <label for="storyDescInput" class="ruled-label">
                        <span class="handwritten-number">3.</span>
                        <span class="label-heading">Story Description</span>
                      </label>
                      <div class="corner-mic-badge" id="micBadge_storyDescription"
                        title="Recording active on Story Description">
                        <span class="live-dot"></span>

                        <span class="rec-label">Recording</span>
                      </div>
                    </div>

                    <div class="paper-input-container field-multi-line" id="storyDescWrapper">
                      <textarea id="storyDescInput" class="paper-ruled-textarea"
                        placeholder="Speak or write the background narrative... Built in 1928, this historic home had good bones but needed modern energy for an active family of four..."
                        rows="4" spellcheck="true"></textarea>
                      <div class="input-actions-right desc-actions">
                        <button type="button" id="clearStoryDescBtn" class="paper-action-btn clear-btn hidden"
                          title="Erase description" aria-label="Clear story description">
                          <svg class="eraser-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6 18M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    <!--div class="manuscript-meta-row">
                      <div class="meta-stats">
                        <span class="quill-count-icon">🖋️</span>
                        <span id="storyDescWordCount" class="stat-pill">0 words</span>
                        <span class="meta-separator">&bull;</span>
                        <span id="storyDescCharCount" class="stat-pill">0 characters</span>
                      </div>
                    </div-->
                  </section>

                  <!-- FIELD 4: Challenge Description -->
                  <section class="notepad-row">
                    <div class="row-header">
                      <label for="challengeDescInput" class="ruled-label">
                        <span class="handwritten-number">4.</span>
                        <span class="label-heading">Challenge Description</span>
                      </label>
                      <div class="corner-mic-badge" id="micBadge_challengeDescription"
                        title="Recording active on Challenge Description">
                        <span class="live-dot"></span>

                        <span class="rec-label">Recording</span>
                      </div>
                    </div>

                    <div class="paper-input-container field-multi-line" id="challengeDescWrapper">
                      <textarea id="challengeDescInput" class="paper-ruled-textarea"
                        placeholder="Speak the challenges... Cramped galley layout, load-bearing walls blocking natural daylight, sagging joists, and poor insulation..."
                        rows="4" spellcheck="true"></textarea>
                      <div class="input-actions-right desc-actions">
                        <button type="button" id="clearChallengeDescBtn" class="paper-action-btn clear-btn hidden"
                          title="Erase challenge description" aria-label="Clear challenge description">
                          <svg class="eraser-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6 18M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    <!--div class="manuscript-meta-row">
                      <div class="meta-stats">
                        <span class="quill-count-icon">🖋️</span>
                        <span id="challengeDescWordCount" class="stat-pill">0 words</span>
                        <span class="meta-separator">&bull;</span>
                        <span id="challengeDescCharCount" class="stat-pill">0 characters</span>
                      </div>
                    </div-->
                  </section>

                  <!-- FIELD 5: Plan Description -->
                  <section class="notepad-row">
                    <div class="row-header">
                      <label for="planDescInput" class="ruled-label">
                        <span class="handwritten-number">5.</span>
                        <span class="label-heading">Plan Description</span>
                      </label>
                      <div class="corner-mic-badge" id="micBadge_planDescription"
                        title="Recording active on Plan Description">
                        <span class="live-dot"></span>

                        <span class="rec-label">Recording</span>
                      </div>
                    </div>

                    <div class="paper-input-container field-multi-line" id="planDescWrapper">
                      <textarea id="planDescInput" class="paper-ruled-textarea"
                        placeholder="Speak the design solutions... Open the sightlines with recessed steel beams, introduce double skylights, design a central walnut island with butcher block..."
                        rows="4" spellcheck="true"></textarea>
                      <div class="input-actions-right desc-actions">
                        <button type="button" id="clearPlanDescBtn" class="paper-action-btn clear-btn hidden"
                          title="Erase plan description" aria-label="Clear plan description">
                          <svg class="eraser-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6 18M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    <!--div class="manuscript-meta-row">
                      <div class="meta-stats">
                        <span class="quill-count-icon">🖋️</span>
                        <span id="planDescWordCount" class="stat-pill">0 words</span>
                        <span class="meta-separator">&bull;</span>
                        <span id="planDescCharCount" class="stat-pill">0 characters</span>
                      </div>
                    </div-->
                  </section>

                  <!-- FIELD 6: Makeover Description -->
                  <section class="notepad-row">
                    <div class="row-header">
                      <label for="makeoverDescInput" class="ruled-label">
                        <span class="handwritten-number">6.</span>
                        <span class="label-heading">Makeover Description</span>
                      </label>
                      <div class="corner-mic-badge" id="micBadge_makeoverDescription"
                        title="Recording active on Makeover Description">
                        <span class="live-dot"></span>

                        <span class="rec-label">Recording</span>
                      </div>
                    </div>

                    <div class="paper-input-container field-multi-line" id="makeoverDescWrapper">
                      <textarea id="makeoverDescInput" class="paper-ruled-textarea"
                        placeholder="Speak the finished result... A sunlit open floorplan with bespoke fluted millwork, honed marble countertops, unlacquered brass hardware, and floor-to-ceiling glass patio sliders..."
                        rows="4" spellcheck="true"></textarea>
                      <div class="input-actions-right desc-actions">
                        <button type="button" id="clearMakeoverDescBtn" class="paper-action-btn clear-btn hidden"
                          title="Erase makeover description" aria-label="Clear makeover description">
                          <svg class="eraser-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6 18M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    <!--div class="manuscript-meta-row">
                      <div class="meta-stats">
                        <span class="quill-count-icon">🖋️</span>
                        <span id="makeoverDescWordCount" class="stat-pill">0 words</span>
                        <span class="meta-separator">&bull;</span>
                        <span id="makeoverDescCharCount" class="stat-pill">0 characters</span>
                      </div>
                    </div-->
                  </section>

                  <!-- FIELD 7: Owner Description -->
                  <section class="notepad-row">
                    <div class="row-header">
                      <label for="ownerDescInput" class="ruled-label">
                        <span class="handwritten-number">7.</span>
                        <span class="label-heading">Owner Description</span>
                      </label>
                      <div class="corner-mic-badge" id="micBadge_ownerDescription"
                        title="Recording active on Owner Description">
                        <span class="live-dot"></span>

                        <span class="rec-label">Recording</span>
                      </div>
                    </div>

                    <div class="paper-input-container field-multi-line" id="ownerDescWrapper">
                      <textarea id="ownerDescInput" class="paper-ruled-textarea"
                        placeholder="Speak or write the owner description... The homeowners wanted an open, welcoming environment that celebrates natural light..."
                        rows="4" spellcheck="true"></textarea>
                      <div class="input-actions-right desc-actions">
                        <button type="button" id="clearOwnerDescBtn" class="paper-action-btn clear-btn hidden"
                          title="Erase owner description" aria-label="Clear owner description">
                          <svg class="eraser-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6 18M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                    </div>

                    <!--div class="manuscript-meta-row">
                      <div class="meta-stats">
                        <span class="quill-count-icon">🖋️</span>
                        <span id="ownerDescWordCount" class="stat-pill">0 words</span>
                        <span class="meta-separator">&bull;</span>
                        <span id="ownerDescCharCount" class="stat-pill">0 characters</span>
                      </div>
                      <div class="meta-guarantee">
                      </div>
                    </div-->
                  </section>

                </form>
              </div> <!-- /.form-scroll-container -->

              <!-- Sticky Notepad Bottom Actions Bar (Pinned at bottom regardless of scroll) -->
              <div class="notepad-sticky-actions">
                <div class="action-buttons-group">
                  <!-- SEND TO GOOGLE SHEET BUTTON -->
                  <button type="button" id="submitBtn" class="wax-seal-btn" disabled>
                    <svg class="send-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                      stroke-linecap="round" stroke-linejoin="round">
                      <line x1="22" y1="2" x2="11" y2="13"></line>
                      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>

                    <span id="submitBtnText" class="seal-btn-label">Send to Google Sheet</span>

                    <span class="btn-spinner hidden" id="btnSpinner" aria-hidden="true"></span>
                  </button>

                  <!-- OPEN GOOGLE SHEET BUTTON -->
                  <a href="https://docs.google.com/spreadsheets/d/1PETlMXFGuKl7-n84yRwuYbKS5xrPl79ykV9FyfzprYk/edit#gid=0"
                    target="_blank" rel="noopener noreferrer" id="openSheetBtn" class="open-sheet-btn"
                    title="Open connected Google Sheet in new tab">
                    <!-- Google Sheets grid SVG icon -->

                    <span class="sheet-btn-label">Open Google Sheet</span>
                  </a>
                </div>

                <div class="paper-shortcut-guide">
                  <span class="shortcut-pen">⚡</span>
                  <span class="shortcut-desktop">Quick Send: Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to send. </span>
                  <span class="shortcut-hint">Tap or click any field to speak or write.</span>
                </div>
              </div>

              <!-- Result / Telegram Dispatch Banner -->
              <div id="toastMessage" class="toast-banner hidden" role="alert" aria-live="assertive">
                <div class="toast-wax-seal" id="toastIcon"></div>
                <div class="toast-body">
                  <div id="toastTitle" class="toast-title">Data Sent to Google Sheet!</div>
                  <div id="toastSubtitle" class="toast-subtitle">Row appended successfully to Google Sheet.</div>
                </div>
                <button id="toastCloseBtn" class="toast-close" aria-label="Close notification">&times;</button>
              </div>

            </div> <!-- /.notepad-content -->

            <!-- Paper page bottom folded corner effect -->
            <div class="paper-fold-corner" aria-hidden="true"></div>
          </main> <!-- /.notepad-sheet -->
        </div> <!-- /.notepad-container -->
      </div> <!-- /.notepad-layout-wrapper -->


    </div> <!-- /.app-layout -->
  </div> <!-- /.desk-canvas -->

  <script src="app.js"></script>
</body>

</html>
